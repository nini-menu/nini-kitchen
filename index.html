<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#252525">
<title>НИНИ · Кухня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --ink:#252525; --paper:#FFFFFF; --card:#FAF8F6; --olive:#8F883D; --olive-ink:#6E6829;
  --pink:#F8BDC4; --pink-soft:#FCE6E9; --silver:#BDB3B3; --muted:#7D7671;
  --line:rgba(37,37,37,.12); --grid:rgba(37,37,37,.07); --warn:#B0473F;
  --bar:#252525; --bar-ink:#FAF8F6; --hl:#F3F0D9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Geologica,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
  font-size:17px;line-height:1.5;font-weight:300;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bar-ink);padding:10px 16px 0;padding-top:max(10px,env(safe-area-inset-top))}
.row1{display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.08em;line-height:1;white-space:nowrap}
.logo i{font-style:normal;display:inline-block;transform:scaleX(-1)}
.logo small{font-size:11px;letter-spacing:.18em;font-weight:600;margin-left:8px;opacity:.7;text-transform:uppercase}
.search{flex:1;min-width:0;height:44px;border-radius:22px;border:0;padding:0 16px;background:rgba(250,248,246,.12);color:var(--bar-ink);font-size:16px}
.search::placeholder{color:rgba(250,248,246,.55)}
.ibtn{height:44px;min-width:44px;border-radius:22px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(250,248,246,.12);font-size:13px;font-weight:600;white-space:nowrap}
.ibtn[aria-pressed="true"]{background:var(--olive);color:#fff}
.ibtn[hidden]{display:none}
.ibtn svg{width:20px;height:20px;flex:none}
.ibtn .lbl{display:none}
.ibtn .cnt{background:var(--pink);color:#252525;border-radius:10px;padding:0 6px;font-size:12px;line-height:18px}
@media (min-width:700px){.ibtn .lbl{display:inline}}
@media (max-width:480px){.logo small{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(250,248,246,.25);font-size:14px;font-weight:400;white-space:nowrap}
.chip span{opacity:.55;margin-left:4px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);font-weight:600}

/* allergen panel */
.algpanel{display:none;padding:4px 0 12px}
.algpanel.on{display:block}
.algpanel p{font-size:13px;opacity:.75;margin-bottom:8px}
.algs{display:flex;flex-wrap:wrap;gap:6px}
.alg{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(250,248,246,.25);font-size:14px}
.alg[aria-pressed="true"]{background:var(--pink);color:#252525;border-color:var(--pink);font-weight:600;text-decoration:line-through}
.alg.clear{border-style:dashed;opacity:.8}

/* ---------- layout ---------- */
.wrap{display:block}
.list{padding:8px 0 40px}
.detail{display:none}
body.showing .list{display:none}
body.showing .detail{display:block}
@media (min-width:900px){
  .wrap{display:grid;grid-template-columns:minmax(320px,380px) 1fr;height:calc(100vh - var(--toph,110px))}
  .list{display:block !important;overflow-y:auto;border-right:1px solid var(--line);padding-bottom:40px}
  .detail{display:block !important;overflow-y:auto}
  .back{display:none !important}
}
.count{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 16px 6px}
.note{margin:4px 16px 8px;padding:10px 12px;border-radius:10px;background:var(--pink-soft);font-size:14px}
.sechead{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-ink);padding:18px 16px 6px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;min-height:72px;border-bottom:1px solid var(--line)}
.item[aria-current="true"]{background:var(--hl)}
.th{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--grid);display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--silver);font-size:20px}
.it{min-width:0;flex:1}
.nm{font-weight:600;font-size:16px;line-height:1.25}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.mini{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--silver);color:var(--muted);
  border-radius:4px;padding:1px 5px;margin:4px 4px 0 0}
.mini.draft{border-color:var(--olive);color:var(--olive-ink)}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}
.foot{padding:24px 16px 8px;font-size:13px;color:var(--muted);line-height:1.6}
.foot b{color:var(--ink);font-weight:600}

/* ---------- card ---------- */
.detail-in{max-width:980px;padding:0 16px 80px}
.back{position:sticky;top:var(--toph,110px);z-index:5;display:flex;align-items:center;gap:6px;height:48px;width:calc(100% + 32px);margin:0 -16px;padding:0 16px;
  background:var(--paper);border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.back svg{width:20px;height:20px}
.hd{padding:18px 0 8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-ink)}
h1{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.fact b{display:block;color:var(--ink);font-size:17px;font-weight:600}
.tags{margin-top:8px}
.cols{display:grid;gap:24px;margin-top:16px}
@media (min-width:1200px){.cols{grid-template-columns:minmax(300px,420px) 1fr}}
.shot{margin:0}
.shot img{width:100%;display:block;border-radius:12px;background:var(--grid)}
.shot figcaption{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}
h2{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.cols > div > h2:first-child{margin-top:0}

.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.stepper .l{font-size:14px;color:var(--muted);flex:1;min-width:120px}
.stepper .l b{color:var(--ink);font-weight:600}
.sbtn{width:48px;height:48px;border-radius:24px;background:var(--ink);color:var(--paper);font-size:26px;line-height:1;font-weight:300}
.sbtn:disabled{opacity:.25}
.sval{width:64px;height:48px;text-align:center;font-size:24px;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.quick{display:flex;gap:6px;width:100%}
.quick button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.ledger{background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:4px 0}
.ln{display:flex;align-items:baseline;gap:8px;padding:8px 6px;font-size:17px}
.ln + .ln{border-top:1px dashed var(--line)}
.ln .ing{font-weight:400}
.ln .dots{flex:1;border-bottom:1px dotted var(--silver);transform:translateY(-4px);min-width:12px}
.ln .g{font-weight:700;white-space:nowrap;text-align:right}
.ln .g small{display:block;font-weight:300;font-size:12px;color:var(--muted)}
.ln.scaled .g{color:var(--olive-ink)}
.ln.miss .g{background:var(--pink-soft);padding:0 6px;border-radius:6px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

.tech{font-size:17px;line-height:1.6}
.tech p{margin-bottom:12px}
.tech b,.tech strong{font-weight:700}
.algbox{margin-top:18px;border-left:4px solid var(--pink);background:var(--pink-soft);border-radius:0 12px 12px 0;padding:12px 14px;font-size:16px}
.algbox b{font-weight:700}
.store{margin-top:10px;border-left:4px solid var(--olive);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px}
.store b{font-weight:700}
details.q{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.q summary{cursor:pointer;padding:12px 14px;font-size:14px;font-weight:600;color:var(--muted);list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"▸ ";}
details.q[open] summary::before{content:"▾ ";}
details.q ul{padding:0 14px 12px 32px;font-size:14px}
details.q li{margin-bottom:6px}
.placeholder{padding:80px 24px;text-align:center;color:var(--muted)}
.placeholder .big{font-size:48px;font-weight:700;letter-spacing:-.08em;color:var(--silver);margin-bottom:12px}

/* storage view */
.st{padding:10px 16px;border-bottom:1px solid var(--line)}
.st .n{font-weight:600}
.st .t{font-weight:700;color:var(--olive-ink)}
.st .t.gap{color:var(--warn)}
.st .w{font-size:14px;color:var(--muted)}
.st .r{font-size:13px;color:var(--muted);margin-top:2px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  border-radius:22px;padding:10px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="row1">
    <span class="logo">Н<i>Н</i><small>кухня</small></span>
    <input class="search" id="q" type="search" placeholder="Блюдо или продукт" aria-label="Поиск по блюдам и продуктам" autocomplete="off">
    <button class="ibtn" id="bAlg" aria-pressed="false" aria-controls="algpanel" title="Фильтр аллергенов">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      <span class="lbl">Аллергены</span><span class="cnt" id="algCnt" hidden></span>
    </button>
    <button class="ibtn" id="bStore" aria-pressed="false" title="Сроки хранения">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      <span class="lbl">Хранение</span>
    </button>
    <button class="ibtn" id="bWake" aria-pressed="false" title="Не гасить экран">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="lbl">Экран</span>
    </button>
  </div>
  <div class="algpanel" id="algpanel">
    <p>Отметьте, чего <b>не должно быть</b> в блюде — такие позиции скроются. Следы и «может содержать» тоже считаются.</p>
    <div class="algs" id="algs"></div>
  </div>
  <nav class="chips" id="chips" aria-label="Разделы"></nav>
</header>

<div class="wrap">
  <section class="list" id="list" aria-label="Список позиций"></section>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

 креветкой", "p": "710 ₽", "o": "250 г", "k": "389 / 25,8 / 14,9 / 34,8", "c": [["Тартин пшеничный", "75 г"], ["Скрембл", "110 г"], ["— яйцо", "2 шт"], ["— сливки 33 %", "10 г"], ["— соль", "1 г"], ["Креветка тигровая", "50 г"], ["Пармезан", "15 г"], ["Микрозелень", "2 г"]], "t": "<p><b>Подготовка.<\/b> Тартин подсушить. Креветку обжарить на чесночном масле, 1–1,5 минуты.<\/p><p><b>Скрембл.<\/b> Холодная смазанная сковорода, два взбитых яйца с солью, нагрев <b>800–1000 Вт<\/b>. Мешать до лёгкого загустения, <b>затем<\/b> влить сливки 33 % 10 г. Снять недоготовленным, масса глянцевая.<\/p><p><b>Сборка.<\/b> Тартин, скрембл шапкой, креветка сверху, пармезан, микрозелень.<\/p><p><b>Контроль.<\/b> Креветка сочная, скрембл кремовый.<\/p>", "a": "Яйца, молоко, глютен, ракообразные.", "f": ["Норма сливок 5 г на яйцо выведена из базовой технологии (3 яйца / 15 г). Для тоста это 10 г вместо 20 — подтвердить у шефа."], "g": [], "id": 22, "img": "img/022.jpg", "th": "img/022-t.jpg"}, {"s": "Хлеб", "n": "Сэндвич «Индейка»", "p": "650 ₽", "o": "310 г", "k": "499 / 27,9 / 13,6 / 65,1", "c": [["Хлеб пшеничный", "120 г"], ["Мусс творожный", "30 г"], ["Песто соб. пр-ва", "граммовка не указана"], ["Руккола", "15 г"], ["Помидор", "50 г"], ["Огурец свежий", "30 г"], ["Филе индейки", "50 г"]], "t": "<p><b>Подготовка.<\/b> Хлеб пшеничный 120 г разрезать, подсушить срезом на сухом гриле 20–30 секунд — иначе размокнет от помидора. Индейку нарезать, помидор и огурец слайсами.<\/p><p><b>Сборка.<\/b> Нижняя половина: мусс творожный, руккола, индейка, помидор, огурец, песто. Верхняя половина. Разрезать по диагонали.<\/p><p><b>Контроль.<\/b> Помидор кладём между слоями мяса и зелени, не на голый хлеб. Собираем под заказ — заранее собранный сэндвич мокрый через 5 минут.<\/p>", "a": "Молоко, глютен, орехи (песто).", "f": ["Граммовка песто не проставлена."], "g": [], "id": 23, "img": "img/023.jpg", "th": "img/023-t.jpg"}, {"s": "Хлеб", "n": "Сэндвич «Ростбиф»", "p": "690 ₽", "o": "315 г", "k": "51 2,8", "c": [["Манная крупа", "30 г"], ["Молоко 3,5 %", "200 г"], ["Сливки 33 %", "50 г"], ["Сахар / соль", "6 / 1 г"], ["Масло гхи", "3 г"], ["Кедровый орех", "2 г"], ["Конфитюр смородиновый — какая версия?", "20 г"]], "t": "<p><b>Приготовление.<\/b> В сотейник молоко 200 г и сливки 50 г, минимальный огонь. Как только начнёт закипать — <b>тонкой струйкой манку, активно мешая венчиком<\/b>. Соль и сахар, довести до вкуса. Снять с огня, как только каша начнёт густеть.<\/p><p><b>Текстура нежная и текучая.<\/b> Каша густеет при остывании — это учитываем на плите и снимаем чуть раньше, чем кажется готовой.<\/p><p><b>Сборка.<\/b> Каша в тарелку, сверху масло гхи, квенель конфитюра, кедровый орех.<\/p><p><b>Контроль.<\/b> Комков нет. Если появились — процедить или переварить заново, гостю не отдаём.<\/p>", "a": "Молоко, глютен, орехи.", "f": ["Указать версию конфитюра — с сахаром или без."], "g": ["❤️"], "id": 26, "img": "img/026.jpg", "th": "img/026-t.jpg"}, {"s": "Каши", "n": "Каша манная · белый шоколад / манго", "p": "320 ₽", "o": "220 г", "k": "136 / 2,9 / 4,2 / 22", "c": [["Манная крупа", "30 г"], ["Молоко кокосовое", "250 г"], ["Мусс цитрус-манго — какая версия?", "15 г"], ["Сахар / соль", "6 / 1 г"], ["Цедра лайма", "0,5 г"], ["Кокосовая стружка", "0,5 г"], ["Белый шоколад", "1 г"]], "t": "<p><b>Приготовление.<\/b> Кокосовое молоко 250 г в сотейник, минимальный огонь. При закипании — манку тонкой струйкой, активно мешая венчиком. Соль и сахар до вкуса. Снять при загустении, текстура текучая.<\/p><p><b>Сборка.<\/b> Каша в тарелку, мусс цитрус-манго, стружка белого шоколада, кокосовая стружка, цедра лайма.<\/p><p><b>Контроль.<\/b> Кокосовое молоко пригорает быстрее коровьего — огонь минимальный, венчик не останавливаем.<\/p>", "a": "Глютен, кокос, возможны соя и орехи (шоколад).", "f": ["С проработки 15.08: на проработке забыли цедру лайма. Она есть в составе (0,5 г) — вносить обязательно, это вкусовой акцент позиции.", "Заявленные 62 ккал на 100 г возможны только если кокосовое молоко — это напиток, а не консервированное молоко. Разница в калорийности пятикратная, уточнить продукт.", "Указать версию мусса манго."], "g": ["lactose free"], "id": 27, "img": "img/027.jpg", "th": "img/027-t.jpg"}, {"s": "Каши", "n": "Каша гречневая · мусс пармезан / яйцо пашот", "p": "320 ₽", "o": "220 г", "k": "376 / 17,6 / 13,2 / 48,4", "c": [["Крупа гречневая", "150 г"], ["Молоко 3,5 %", "100 г"], ["Сливки 33 %", "30 г"], ["Соль / сахар", "1 / 3 г"], ["Мусс из пармезана", "20 г"], ["Яйцо пашот", "1 шт"], ["Микрозелень", "1 г"], ["Пармезан", "5 г"]], "t": "<p><b>Подготовка.<\/b> Гречка — из заготовки. Мусс пармезан прогреть на водяной бане до жидкого состояния.<\/p><p><b>Приготовление.<\/b> Готовую крупу 150 г, молоко 100 г и сливки 30 г в сотейник, варить 3–5 минут до загустения, довести до вкуса солью и сахаром. Одновременно сварить яйцо пашот.<\/p><p><b>Сборка.<\/b> Каша, сверху яйцо пашот, лента мусса пармезан, тёртый пармезан, микрозелень.<\/p><p><b>Контроль.<\/b> Пашот с жидким желтком — он и есть соус для этой каши. Мусс течёт, а не лежит комком.<\/p>", "a": "Яйца, молоко.", "f": ["В меню эта позиция стоит как «Гречка» — без описания и без цены. Блюдо с яйцом пашот и муссом из пармезана продаётся вслепую."], "g": [], "id": 28, "img": "img/028.jpg", "th": "img/028-t.jpg"}, {"s": "Каши", "n": "Каша овсяная · кофейный мусс", "p": "320 ₽", "o": "220 г", "k": "354 / 8,8 / 17,6 / 38,5", "c": [["Овсянка", "60 г"], ["Молоко миндальное", "70 г"], ["Вода", "70 г"], ["Сушёное яблоко", "3 г"], ["Соль / сахар", "1 / 3 г"], ["Кофейный мусс", "20 г"], ["Фундук", "10 г"]], "t": "<p><b>Приготовление.<\/b> Хлопья промыть, варить на воде 70 г 6 минут. Добавить миндальное молоко 70 г, варить ещё 3–4 минуты. Довести до вкуса солью и сахаром.<\/p><p><b>Сборка.<\/b> Каша в тарелку, сверху кофейный мусс, сушёное яблоко, фундук.<\/p><p><b>Контроль.<\/b> Кофейный мусс достаём холодным и кладём на горячую кашу непосредственно перед отдачей — иначе он осядет.<\/p>", "a": "Глютен, орехи (миндальное молоко, фундук), молоко в муссе.", "f": ["В меню позиция названа «кофейный мусс / миндаль». Миндаля в блюде нет — есть фундук и миндальное молоко.", "Выход в карте не проставлен."], "g": [], "id": 29, "img": "img/029.jpg", "th": "img/029-t.jpg"}, {"s": "Каши", "n": "Каша овсяная · томат / яйцо", "p": "320 ₽", "o": "220 г", "k": "279 / 11 / 9,9 / 33", "c": [["Овсянка", "60 г"], ["Вода / соль", "150 / 1 г"], ["Помидор", "50 г"], ["Масло гхи", "20 г"], ["Чеснок", "3 г"], ["Смесь перцев / масло оливковое", "1 / 1 г"], ["Протёртые томаты", "30 г"], ["Яйцо", "1 шт"], ["Микрозелень", "1 г"], ["Сушёный томат", "2 г"]], "t": "<p><b>Приготовление.<\/b> Хлопья промыть, варить на воде 150 г 6 минут. Яйцо варить 7 минут. Помидоры нарезать мелким кубиком и обжарить на масле гхи с чесноком.<\/p><p>Соединить обжаренные томаты с готовой кашей, добавить протёртые томаты 30 г, довести до вкуса солью, сахаром, смесью перцев.<\/p><p><b>Сборка.<\/b> Каша, сверху половинка яйца, вяленый томат, микрозелень, капля оливкового масла.<\/p><p><b>Контроль.<\/b> Единственная несладкая каша в меню — не перепутать заготовку и не досыпать сахар по привычке.<\/p>", "a": "Яйца, глютен, молоко (гхи).", "f": ["В меню позиция называется «томат / пармезан». Пармезана в рецептуре нет вообще, есть яйцо. Название не соответствует блюду."], "g": [], "id": 30, "img": "img/030.jpg", "th": "img/030-t.jpg"}, {"s": "Каши", "n": "Каша рисовая · манго", "p": "320 ₽", "o": "220 г", "k": "378 / 6,6 / 17,6 / 44", "c": [["Рис варёный", "150 г"], ["Сливки 33 %", "30 г"], ["Молоко кокосовое", "100 г"], ["Соль / сахар", "3 / 5 г"], ["Мусс цитрус-манго — какая версия?", "40 г"], ["Карамелизованный кешью", "10 г"]], "t": "<p><b>Подготовка.<\/b> Рис — из заготовки для каши, не из заготовки для поке: та заправлена уксусом и сахаром.<\/p><p><b>Приготовление.<\/b> Готовую крупу 150 г, кокосовое молоко 100 г и сливки 30 г в сотейник, медленный огонь, 3–5 минут до загустения, довести до вкуса.<\/p><p><b>Сборка.<\/b> Каша, сверху мусс цитрус-манго 40 г, карамелизованный кешью.<\/p><p><b>Контроль.<\/b> Рис для каши и рис для поке хранятся отдельно и подписаны — перепутать легко, на вкусе это слышно сразу.<\/p>", "a": "Молоко, кокос, орехи (кешью).", "f": ["В производственной карте блюдо называется «с муссом манго и кешью», в меню — «кокос / манго». Привести к одному.", "Указать версию мусса манго — с сахаром или без."], "g": [], "id": 31, "img": "img/031.jpg", "th": "img/031-t.jpg"}, {"s": "Каши", "n": "Каша пшённая · финик / солёная карамель", "p": "320 ₽", "o": "220 г", "k": "249 / 6,6 / 2,2 / 48,4", "c": [["Пшено варёное", "150 г"], ["Молоко кокосовое", "100 г"], ["Соль / сахар", "1 / 3 г"], ["Финики", "10 г"], ["Соус финиковый", "10 г"], ["Солёная карамель, мельница", "1 г"]], "t": "<p><b>Подготовка.<\/b> Пшено — из заготовки.<\/p><p><b>Приготовление.<\/b> Готовую крупу 150 г и кокосовое молоко 100 г в сотейник, варить 3–5 минут до загустения, довести до вкуса.<\/p><p><b>Сборка.<\/b> Каша, сверху финиковый соус, рубленые финики, солёная карамель из мельницы.<\/p><p><b>Контроль.<\/b> Карамель мелем непосредственно на тарелку перед отдачей — от влаги она слипается.<\/p>", "a": "Кокос, возможны орехи и соя, карамель может содержать глютен.", "f": ["С проработки 15.08: доваривать немного дольше — крупа осталась недоваренной.", "КБЖУ пересчитано по меню: 249 ккал вместо 316. Прежнее значение в карте не соответствовало ни весу, ни калорийности на 100 г.", "В меню вес 280 г, в карте 220 г."], "g": ["lactose free"], "id": 32, "img": "img/032.jpg", "th": "img/032-t.jpg"}, {"s": "Сладкое", "n": "Протеиновые оладьи · базовое тесто", "p": "полуфабрикат", "o": "3 шт по 80 г = 240 г", "k": "—", "c": [["Творог мягкий", "120 г"], ["Яйцо", "1 шт / 50 г"], ["Мука пшеничная", "40 г"], ["Сахар", "20 г"], ["Протеин", "15 г"], ["Разрыхлитель", "2 г"], ["Соль", "1 г"]], "t": "Смешать все ингредиенты венчиком. <strong>Обжаривать под крышкой на слабом огне по 2 минуты<\/strong> с каждой стороны.", "a": "Яйца, молоко, глютен, соя (протеин).", "f": ["Безсахарной версии теста нет."], "g": [], "id": 33}, {"s": "Сладкое", "n": "Протеиновые оладьи · шоколад / пекан", "p": "610 ₽", "o": "225 г", "k": "504 / 27 / 22,5 / 40,5", "c": [["Оладьи", "3 шт / 240 г"], ["Шоколадный соус б/с", "50 г"], ["Пекан", "15 г"], ["Клюква вяленая", "20 г"]], "t": "<strong>Шоколадный соус б/с:<\/strong> молочный шоколад без сахара 100 г растопить на водяной бане, постепенно ввести кокосовое молоко 120 мл до однородности, добавить морскую соль 1 г, снять с огня.", "a": "Яйца, молоко, глютен, орехи, соя.", "f": ["С проработки 15.08: соус сделать гуще и насыщеннее по вкусу — жидкий соус полностью впитывается в оладьи.", "Сумма компонентов 325 г при заявленном выходе 225 г.", "Клюква вяленая 20 г не указана в названии позиции в меню."], "g": ["protein"], "id": 34, "img": "img/034.jpg", "th": "img/034-t.jpg"}, {"s": "Сладкое", "n": "Протеиновые оладьи · смородина / рикотта", "p": "610 ₽", "o": "225 г", "k": "374 / 27 / 11,2 / 31,5", "c": [["Оладьи", "3 шт / 240 г"], ["Конфитюр смородиновый — какая версия?", "25 г"], ["Крем «рикотта»", "30 г"], ["Крошка фисташковая", "5 г"]], "t": "<strong>Крем из рикотты:<\/strong> рикотта 500 г, сахарная пудра 80–120 г, холодные сливки 33 % 200 мл, цедра апельсина 15 г — взбить. Выход 815 г, на порцию 30 г.", "a": "Яйца, молоко, глютен, орехи.", "f": ["С проработки 15.08: соус сделать гуще и насыщеннее по вкусу — жидкий соус полностью впитывается в оладьи.", "В меню вес 225 г, в карте 300 г.", "Указать версию конфитюра.", "У крема из рикотты безсахарной версии нет."], "g": ["protein"], "id": 35, "img": "img/035.jpg", "th": "img/035-t.jpg"}, {"s": "Сладкое", "n": "Мягкий творог / гранола · классика", "p": "390 ₽", "o": "200 г", "k": "303 / 18 / 15 / 24", "c": [["Творог мягкий", "130 г"], ["Гранола домашняя", "40 г"], ["Ягода сезонная", "20 г"], ["Сироп без сахара", "10 г"]], "t": "<p>Творог в креманку, разровнять.<\/p><p><strong>Гранолу насыпать при подаче<\/strong>, не заранее — иначе размокнет и потеряет хруст.<\/p><p>Ягода сверху, сироп по кругу.<\/p>", "a": "Молоко, орехи, глютен (гранола).", "f": ["Рецептуры домашней гранолы нет ни в одном файле."], "g": ["protein", "проект"], "id": 36, "img": "img/036.jpg", "th": "img/036-t.jpg"}, {"s": "Сладкое", "n": "Мягкий творог / гранола · шоколад / банан", "p": "390 ₽", "o": "200 г", "k": "347 / 18 / 15 / 35", "c": [["Творог мягкий", "120 г"], ["Гранола домашняя", "35 г"], ["Банан", "35 г"], ["Шоколад б/с дроблёный", "10 г"]], "t": "Банан режем кружками 5 мм непосредственно перед подачей. Шоколад дробим ножом, не натираем — нужны крупинки, а не пыль.", "a": "Молоко, орехи, глютен, соя.", "f": [], "g": ["protein", "проект"], "id": 37, "img": "img/037.jpg", "th": "img/037-t.jpg"}, {"s": "Сладкое", "n": "Мягкий творог / гранола · кокос", "p": "390 ₽", "o": "200 г", "k": "303 / 18 / 15 / 24", "c": [["Творог мягкий", "125 г"], ["Гранола домашняя", "40 г"], ["Кокосовая стружка обжаренная", "10 г"], ["Кокосовые чипсы", "15 г"], ["Кокосовый сироп б/с", "10 г"]], "t": "Стружку подсушить на сухой сковороде 1–2 минуты до аромата, остудить. Сырая стружка вкуса не даёт.", "a": "Молоко, кокос, орехи, глютен.", "f": ["В меню КБЖУ полностью совпадают с классикой. Пересчитать после утверждения рецептуры."], "g": ["protein", "проект"], "id": 38}, {"s": "Сладкое", "n": "Sweet-bowl", "p": "410 ₽", "o": "200 г", "k": "385 / 15 / 18 / 40", "c": [["Творог мягкий или густой йогурт", "100 г"], ["Гранола домашняя", "40 г"], ["Банан", "30 г"], ["Ягода сезонная", "20 г"], ["Ореховая паста", "10 г"]], "t": "Собирать секторами, не перемешивая: основа, сверху три зоны — гранола, банан, ягода. Ореховая паста тонкой лентой поверх.", "a": "Молоко, орехи, глютен.", "f": ["В меню нет описания состава — гость не видит, из чего блюдо."], "g": ["проект"], "id": 39, "img": "img/039.jpg", "th": "img/039-t.jpg"}, {"s": "Сладкое", "n": "Сырники классические · базовое тесто", "p": "полуфабрикат", "o": "10 порций · 30 шт по 40 г", "k": "—", "c": [["Творог 5–9 %", "900 г"], ["Мука пшеничная", "180 г"], ["Яйцо", "2 шт / 100 г"], ["Подсластитель", "60 г"], ["Ванилин", "2 г"], ["Соль", "6 г"]], "t": "<p>Творог протереть — крупинки недопустимы. Вымешать, дать постоять 10 минут.<\/p><p>Формовать <strong>строго по 40 г<\/strong>, толщина 15 мм. Взвешивать: разнокалиберные сырники на тарелке видно сразу.<\/p><p>Обжарка на минимуме масла, затем духовка 180 °C 5 минут до готовности центра.<\/p>", "a": "Молоко, яйца, глютен.", "f": [], "g": ["проект"], "id": 40}, {"s": "Сладкое", "n": "Сырники · смородина / мак", "p": "390 ₽", "o": "150 г", "k": "382 / 20,2 / 16,9 / 45,9", "c": [["Сырники", "3 шт / 120 г"], ["Конфитюр смородиновый — какая версия?", "20 г"], ["Мак", "2 г"], ["Сметана", "10 г"]], "t": "Конфитюр и сметану подавать в отдельных розетках, сверху не поливать.", "a": "Молоко, яйца, глютен, мак.", "f": ["Указать версию конфитюра — версия с сахаром это 1:1 по массе."], "g": ["проект"], "id": 41, "img": "img/041.jpg", "th": "img/041-t.jpg"}, {"s": "Сладкое", "n": "Сырники · кокосовая сгущёнка / крамбл", "p": "390 ₽", "o": "150 г", "k": "422 / 27 / 15 / 49,5", "c": [["Сырники", "3 шт / 120 г"], ["Кокосовая сгущёнка", "20 г"], ["Крамбл", "10 г"]], "t": "<p><strong>Крамбл, заготовка на 20 порций:<\/strong> мука 100 г, холодное сливочное масло 70 г, подсластитель 40 г, соль 1 г. Растереть в крошку, духовка 170 °C 12 минут, остудить, хранить герметично.<\/p><p>Крамбл насыпать при подаче. Сгущёнку слегка прогреть, чтобы текла.<\/p>", "a": "Молоко, яйца, глютен, кокос.", "f": ["КБЖУ пересчитано и выросло вдвое: в карте стояли 281 ккал — это значение на 100 г из меню, ошибочно записанное как на порцию. На порцию 150 г выходит 422 ккал."], "g": ["проект"], "id": 42, "img": "img/042.jpg", "th": "img/042-t.jpg"}, {"s": "Сладкое", "n": "Сырники · цитрусовая рикотта", "p": "390 ₽", "o": "150 г", "k": "351 / 19,5 / 12 / 42", "c": [["Сырники", "3 шт / 120 г"], ["Крем из рикотты", "25 г"], ["Цедра апельсина", "2 г"], ["Долька цитруса", "8 г"]], "t": "Крем из рикотты — по карте полуфабриката.", "a": "Молоко, яйца, глютен.", "f": ["Крем из рикотты содержит 80–120 г сахарной пудры на 500 г. Безсахарной версии нет."], "g": ["проект"], "id": 43}, {"s": "Сладкое", "n": "Сырники безлактозные", "p": "430 ₽", "o": "150 г", "k": "351–422 / 19,5–27 / 12–16,9 / 42–49,5", "c": [["Творог безлактозный", "900 г / на 10 порций"], ["Мука рисовая", "150 г"], ["Яйцо", "2 шт / 100 г"], ["Подсластитель", "50 г"], ["Соль / ваниль", "6 / 2 г"], ["Сырники на порцию", "3 шт / 120 г"], ["Топпинг", "30 г"]], "t": "<p>Безлактозный творог влажнее обычного — дать тесту постоять 15 минут, при необходимости добавить муки.<\/p><p>Обжарка <strong>на растительном масле, не сливочном<\/strong>.<\/p><p><strong>Отдельная сковорода и лопатка.<\/strong> Перекрёстный контакт со сливочным маслом убивает смысл позиции.<\/p>", "a": "Яйца. Позиция безлактозная и безглютеновая — проговаривать гостю.", "f": ["Фото временно взято у сырников со смородиной и маком — собственной съёмки нет. Заменить после фотосессии.", "КБЖУ приравнено к обычным сырникам — тесто безлактозное, но по калорийности равноценно; вилка зависит от выбранного топпинга. Отдельного расчёта не делали.", "КБЖУ в меню отсутствуют полностью."], "g": ["lactose free", "проект"], "id": 44, "img": "img/044.jpg", "th": "img/044-t.jpg"}, {"s": "Сладкое", "n": "Протеиновая вафля · банан / арахисовая паста", "p": "490 ₽", "o": "180 г", "k": "675 / 39,6 / 28,8 / 64,8", "c": [["Вафля протеиновая", "110 г"], ["Банан", "40 г"], ["Арахисовая паста", "25 г"], ["Ягода", "5 г"], ["— тесто: мука", "35 г"], ["— протеин растительный", "25 г"], ["— яйцо", "20 г"], ["— растительное молоко", "35 г"], ["— масло растительное", "8 г"], ["— разрыхлитель", "2 г"]], "t": "<p>Тесто с протеином густеет быстро — использовать в течение 20 минут после замеса.<\/p><p>Вафельница 200 °C, 4–5 минут. <strong>Протеиновое тесто пригорает легче обычного<\/strong>, следить за цветом.<\/p>", "a": "Арахис, яйца, глютен, соя.", "f": ["Заявленные 40 г белка по этой рецептуре не выходят — расчётно 28–30 г."], "g": ["protein", "lactose free", "проект"], "id": 45, "img": "img/045.jpg", "th": "img/045-t.jpg"}, {"s": "Сладкое", "n": "Протеиновая вафля · шоколадный крем / ягода", "p": "490 ₽", "o": "180 г", "k": "558 / 32,4 / 19,8 / 64,8", "c": [["Вафля протеиновая", "110 г"], ["Шоколадный соус б/с", "40 г"], ["Ягода свежая", "30 г"]], "t": "<p>Крем наносить при выдаче. Заранее политая вафля отмокает за три минуты.<\/p><p>Единственная сладкая позиция с честным «без сахара» в креме — подчёркивать в подаче.<\/p>", "a": "Яйца, глютен, соя, кокос.", "f": ["В меню КБЖУ на порцию не указаны."], "g": ["protein", "lactose free", "проект"], "id": 46, "img": "img/046.jpg", "th": "img/046-t.jpg"}, {"s": "Сладкое", "n": "Ленивая овсянка · ягода", "p": "470 ₽", "o": "≈300 г", "k": "463 / 12 / 15 / 70", "c": [["Хлопья овсяные", "60 г"], ["Молоко или растительное молоко", "150 г"], ["Йогурт густой", "40 г"], ["Ягода сезонная", "40 г"], ["Семена чиа", "8 г"], ["Ореховая паста", "5 г"]], "t": "<p>Хлопья, молоко, йогурт и чиа соединить, убрать в холодильник <strong>минимум на 6 часов<\/strong>, оптимально на ночь. Заготовка делается накануне.<\/p><p>Ягоду добавлять при подаче — заранее пускает сок и красит основу.<\/p>", "a": "Молоко, глютен (овёс), орехи.", "f": ["Калорийность на 100 г в меню отсутствует.", "Срок хранения ночной заготовки не установлен — обязателен."], "g": ["проект"], "id": 47, "img": "img/047.jpg", "th": "img/047-t.jpg"}, {"s": "Сладкое", "n": "Ленивая овсянка · шоколад / банан", "p": "цена не указана", "o": "≈300 г", "k": "531 / 12 / 27 / 81", "c": [["Хлопья овсяные", "60 г"], ["Молоко", "140 г"], ["Йогурт густой", "40 г"], ["Банан", "40 г"], ["Шоколад б/с", "15 г"], ["Ореховая паста", "10 г"], ["Семена чиа", "8 г"]], "t": "Готовится как ягодная. Банан и шоколад добавлять при подаче.", "a": "Молоко, глютен, орехи, соя.", "f": ["Позици л боула.<\/p><p><b>Подготовка.<\/b> Курицу су-вид нарезать поперёк волокон. Черри пополам, огурец соломкой, морковь отжать от маринада, капусту нашинковать. Кешью подсушить на сухой сковороде до аромата.<\/p><p><b>Сборка.<\/b> Секторами: курица, черри, огурец, капуста, морковь, эдамаме. Кешью и жареный лук сверху — они дают текстуру, кладём последними.<\/p><p><b>Отдача.<\/b> Ореховый соус 30 г подаём <b>отдельно в соуснике<\/b>. КБЖУ позиции указаны без соуса.<\/p>", "a": "Орехи, соя, кунжут.", "f": ["Рецептуры орехового соуса нет."], "g": ["🔥"], "id": 62, "img": "img/062.jpg", "th": "img/062-t.jpg"}, {"s": "Поке и боулы", "n": "Боул курица терияки", "p": "630 ₽", "o": "346 г + соус", "k": "385 / 20 / 4 / 65", "c": [["Рис варёный", "150 г"], ["Курица су-вид / терияки / кунжут", "50 / 10 / 1 г"], ["Огурец", "30 г"], ["Пекинская капуста", "15 г"], ["Морковь маринованная", "30 г"], ["Бобы эдамаме", "30 г"], ["Манго свежий", "30 г"], ["Универсальный соус", "30 г — отдельно"]], "t": "<p><b>Основа.<\/b> Рис для поке 150 г из заготовки утрамбовать в креманке и прогреть в микроволновке. Основа должна быть тёплой, топпинги холодными — в этом весь смысл боула.<\/p><p><b>Подготовка.<\/b> Курицу су-вид <b>обвалять в соусе терияки<\/b>, нарезать. Обсыпать кунжутом. Манго кубиком, огурец соломкой, морковь отжать от маринада.<\/p><p><b>Сборка.<\/b> Секторами: курица, манго, огурец, капуста, морковь, эдамаме.<\/p><p><b>Отдача.<\/b> Универсальный соус 30 г подаём <b>отдельно в соуснике<\/b>. КБЖУ позиции указаны без соуса.<\/p><p><b>Контроль.<\/b> Универсальный соус острый — предупреждаем гостя, если спрашивает.<\/p>", "a": "Соя, кунжут, глютен.", "f": ["Универсальный соус острый — содержит шрирачу."], "g": ["❤️"], "id": 63, "img": "img/063.jpg", "th": "img/063-t.jpg"}, {"s": "Поке и боулы", "n": "Боул киноа курица", "p": "630 ₽", "o": "335 г + соус", "k": "348 / 28 / 9 / 47", "c": [["Киноа", "150 г"], ["Курица су-вид", "50 г"], ["Огурцы", "30 г"], ["Пекинская капуста", "15 г"], ["Морковь маринованная", "30 г"], ["Бобы эдамаме", "30 г"], ["Брокколи", "30 г"], ["Ореховый соус", "30 г — отдельно"]], "t": "<p><b>Основа.<\/b> Киноа 150 г из заготовки утрамбовать в креманке и прогреть в микроволновке. Основа должна быть тёплой, топпинги холодными — в этом весь смысл боула.<\/p><p><b>Подготовка.<\/b> Брокколи отварить 3 минуты, остудить в холодной воде. Курицу су-вид нарезать поперёк волокон. Огурец соломкой, морковь отжать от маринада.<\/p><p><b>Сборка.<\/b> Секторами: курица, брокколи, огурец, пекинская капуста, морковь, эдамаме.<\/p><p><b>Отдача.<\/b> Ореховый соус 30 г подаём <b>отдельно в соуснике<\/b>. КБЖУ позиции указаны без соуса.<\/p>", "a": "Орехи, соя.", "f": ["Рецептуры орехового соуса нет."], "g": ["protein"], "id": 64, "img": "img/064.jpg", "th": "img/064-t.jpg"}, {"s": "Соусы", "n": "Мусс из творожного сыра", "p": "на 1 порцию", "o": "40 г", "k": "—", "c": [["Кремчиз", "30 г"], ["Вода", "10 г"]], "t": "Соотношение кремчиза и воды <strong>3:1<\/strong>. Тщательно смешать венчиком или миксером.", "a": "Молоко.", "f": ["Самый частый полуфабрикат меню — около 20 позиций.", "В картах блюд встречается 15, 20, 30 и 40 г. Определить: нормируется вес готового мусса или вес кремчиза до разведения.", "Срок хранения не установлен."], "g": [], "id": 65}, {"s": "Соусы", "n": "Мусс из пармезана", "p": "2 порции", "o": "≈75 г", "k": "—", "c": [["Пармезан", "30 г"], ["Сливки 33 %", "45 г"]], "t": "<p>Хорошо разогреть сливки в сотейнике. Натереть пармезан, всыпать в сливки, тщательно перемешивая на слабом огне до однородности.<\/p><p>Хранить в контейнере в холодильнике. <strong>Перед подачей нагреть на водяной бане до жидкого состояния.<\/strong><\/p>", "a": "Молоко.", "f": ["Выход ≈37 г на порцию, а в картах блюд стоит 20 и 30 г. Свести."], "g": [], "id": 66}, {"s": "Соусы", "n": "Дзадзики", "p": "полуфабрикат", "o": "≈320 г", "k": "—", "c": [["Рикотта", "250 г"], ["Огурец без влаги", "50 г"], ["Мята", "2 г"], ["Укроп", "2 г"], ["Соль", "1 г"], ["Смесь перцев", "1 г"], ["Сок лимона", "4 г"], ["Масло оливковое", "10 г"]], "t": "<p>Огурец натереть на мелкой тёрке и <strong>обязательно отжать<\/strong>. Неотжатый даёт лужу воды через 20 минут.<\/p><p>Смешать всё, взбить блендером до однородности.<\/p><p><strong>Именно рикотта, не йогурт<\/strong> — это авторская версия, не классика. Не «поправлять» по привычке.<\/p>", "a": "Молоко.", "f": ["Срок хранения: 5 дней."], "g": [], "id": 67}, {"s": "Соусы", "n": "Универсальный (фирменный) соус", "p": "полуфабрикат", "o": "530 г", "k": "—", "c": [["Терияки", "300 г"], ["Вода", "200 г"], ["Устричный соус", "20 г"], ["Шрирача", "10 г"]], "t": "Смешать все ингредиенты и залить в ёмкость для соуса.", "a": "Соя, глютен, моллюски (устричный соус).", "f": ["Соус острый — содержит шрирачу. Идёт в боул креветка манго и боул курица терияки.", "Срок хранения не установлен."], "g": ["острый"], "id": 68}, {"s": "Соусы", "n": "Голландский соус", "p": "2 порции", "o": "≈60 г", "k": "—", "c": [["Яичный желток", "1 шт"], ["Вода", "15 г"], ["Греческий йогурт", "20 г"], ["Горчица", "5 г"], ["Сок лимона", "пара капель"], ["Соль, перец", "по вкусу"]], "t": "<p>Смешать желток с водой в сотейнике, на минимальном огне непрерывно мешать до загустения.<\/p><p>Снять с огня, добавить йогурт, горчицу, лимонный сок и специи. Вернуть на минимальный огонь, мешать до консистенции жидкого крема.<\/p><p>Перед подачей разогреть на водяной бане.<\/p><p><strong>Не кипятить, сильный огонь не давать: йогурт свернётся при 80 °C.<\/strong><\/p>", "a": "Яйца, молоко, горчица.", "f": ["Версия на сливочном масле, встречавшаяся в карте шпинатной вафли, отменена. Рабочая рецептура — эта, на греческом йогурте."], "g": [], "id": 69}, {"s": "Соусы", "n": "Соус тахини", "p": "2 порции", "o": "≈80 г", "k": "—", "c": [["Кунжутная паста", "20 г"], ["Масло кунжутное", "5 г"], ["Сок лимона", "15 г"], ["Горчица", "10 г"], ["Сироп топинамбура", "5 г"], ["Масло растительное", "10 г"], ["Зира молотая", "1 г"]], "t": "Смешать все ингредиенты.", "a": "Кунжут, горчица.", "f": ["В документе три разные рецептуры под названием «тахини». Эта — кунжутная паста 20 г. Вторая: урбеч кунжутный 20, масло раст. 50, масло кунжутное 50, горчица дижонская 10, лимонный сок 15, топинамбур 15, зира 2, соль 1. Третья, без названия: тахини 30, греческий йогурт 80, лимонный сок 1 ст. л., чеснок 1 зубчик, вода 2 ст. л., зелень.", "Ни одна из них не тахини в чистом виде — во всех есть горчица. Название стоит поменять."], "g": [], "id": 70}, {"s": "Соусы", "n": "Спайси", "p": "полуфабрикат", "o": "≈105 г", "k": "—", "c": [["Майонез лёгкий 20 %", "50 г"], ["Шрирача", "15 г"], ["Соевый соус", "5 г"], ["Икра масаго", "10 г"], ["Вода", "25 г"]], "t": "Смешать все ингредиенты и залить в ёмкость для соуса.", "a": "Яйца, рыба, соя, глютен.", "f": ["Острый.", "Срок хранения не установлен."], "g": ["острый"], "id": 71}, {"s": "Соусы", "n": "Мисо-апельсин", "p": "полуфабрикат", "o": "125 г", "k": "—", "c": [["Масло растительное", "40 г"], ["Шрирача", "20 г"], ["Шичими", "10 г"], ["Соевый соус", "30 г"], ["Мёд", "10 г"], ["Имбирь", "5 г"], ["Сок лайма", "10 г"]], "t": "Смешать все ингредиенты.", "a": "Соя, глютен.", "f": ["Острый.", "Срок хранения не установлен."], "g": ["острый"], "id": 72}, {"s": "Соусы", "n": "Кофейный мусс", "p": "полуфабрикат", "o": "≈290 г", "k": "—", "c": [["Сливки 33 %", "180 г"], ["Молоко", "60 г"], ["Желток", "1 шт"], ["Сахар", "40 г"], ["Крахмал кукурузный", "10 г"], ["Соль", "щепоть"], ["Эспрессо", "1 шот"]], "t": "<p>Сливки с молоком разогреть в сотейнике. Отдельно смешать желток, сахар, крахмал и соль, добавить в сотейник.<\/p><p>Готовить на низком огне, постоянно перемешивая, до загустения.<\/p><p>Снять с огня, тонкой струйкой влить кофе, процедить, охладить.<\/p>", "a": "Яйца, молоко.", "f": ["Содержит 40 г сахара. Безсахарной версии нет.", "Срок хранения не установлен."], "g": [], "id": 73}, {"s": "Соусы", "n": "Смородиновый конфитюр — с сахаром", "p": "полуфабрикат", "o": "≈600 г", "k": "—", "c": [["Смородина", "400 г"], ["Сахар", "400 г"]], "t": "В сотейнике с толстым дном на минимальном огне, периодически помешивая, до полного растворения сахара.", "a": "—", "f": ["Соотношение ягоды и сахара один к одному. Идёт в сырники смородина/мак, оладьи рикотта/смородина, кашу манную гхи.", "В картах блюд версия не указана — повар берёт то, что стоит в холодильнике. Прописать явно и маркировать контейнеры цветом."], "g": [], "id": 74}, {"s": "Соусы", "n": "Смородиновый конфитюр — без сахара", "p": "полуфабрикат", "o": "≈450 г", "k": "—", "c": [["Смородина", "400 г"], ["Сахарозаменитель", "20 таблеток"], ["Вода", "100 г"]], "t": "<p>Отдельно растворить сахзам в 100 г воды.<\/p><p>Смородину и воду с сахзамом в сотейник с толстым дном, минимальный огонь, помешивая, 10 минут. <strong>Не кипятить.<\/strong><\/p>", "a": "—", "f": ["Срок хранения: 5 дней."], "g": ["без сахара"], "id": 75}, {"s": "Соусы", "n": "Мусс цитрус-манго — с сахаром", "p": "полуфабрикат", "o": "≈800 г", "k": "—", "c": [["Манго", "500 г"], ["Лайм", "1 шт"], ["Лимон", "1 шт"], ["Апельсин", "1 шт"], ["Сахар", "120 г"], ["Вода", "240 г"]], "t": "<p>Снять цедру лайма и отжать сок. Отжать сок лимона и апельсина. Манго нарезать кубиком.<\/p><p>Всё в сотейник, добавить воду и сахар. Помешивая, довести до кипения, убавить до минимума, варить 10 минут.<\/p><p>Взбить блендером до однородности.<\/p>", "a": "—", "f": [], "g": [], "id": 76}, {"s": "Соусы", "n": "Мусс цитрус-манго — без сахара", "p": "полуфабрикат", "o": "≈780 г", "k": "—", "c": [["Манго", "500 г"], ["Лайм", "1 шт"], ["Лимон", "1 шт"], ["Апельсин", "1 шт"], ["Сахарозаменитель", "20 таблеток"], ["Вода", "240 г"]], "t": "<p>Растворить сахзам в 240 мл воды. Далее как версию с сахаром, но варить 10 минут <strong>не доводя до кипения<\/strong>.<\/p><p>Взбить блендером до однородности.<\/p>", "a": "—", "f": [], "g": ["без сахара"], "id": 77}, {"s": "Соусы", "n": "Шоколадный соус б/с", "p": "полуфабрикат", "o": "220 г · на порцию 50 г", "k": "—", "c": [["Молочный шоколад б/с", "100 г"], ["Кокосовое молоко", "120 г"], ["Соль морская", "1 г"]], "t": "Растопить шоколад на водяной бане, затем постепенно добавлять кокосовое молоко. После получения однородной массы добавить морскую соль и снять с огня.", "a": "Молоко, соя, кокос.", "f": [], "g": ["без сахара"], "id": 78}, {"s": "Соусы", "n": "Крем из рикотты", "p": "полуфабрикат", "o": "815 г · на порцию 30 г", "k": "—", "c": [["Рикотта", "500 г"], ["Сахарная пудра", "80–120 г"], ["Сливки 33 % холодные", "200 г"], ["Цедра апельсина", "15 г"]], "t": "Взбить все ингредиенты. Сливки обязательно холодные.", "a": "Молоко.", "f": ["Безсахарной версии нет. Решить, нужна ли.", "Срок хранения не установлен."], "g": [], "id": 79}, {"s": "Соусы", "n": "Чесночное масло", "p": "полуфабрикат", "o": "≈500 мл", "k": "—", "c": [["Масло растительное", "500 мл"], ["Чеснок", "15 г / 5 зубчиков"]], "t": "Взбить погружным блендером, процедить, перелить в ёмкость для соуса.", "a": "—", "f": ["Срок хранения не установлен."], "g": [], "id": 80}, {"s": "Соусы", "n": "Ореховый соус", "p": "—", "o": "—", "k": "—", "c": [["Рецептура отсутствует", "—"]], "t": "<p>В файле «Тк соусы» стоит только заголовок, рецептуры под ним нет.<\/p><p><strong>Это самый частый соус меню:<\/strong> боул киноа креветка, боул греча, веган-боул, грин-боул, боул курица кешью, боул киноа курица — шесть позиций плюс упоминания в других картах.<\/p>", "a": "Орехи.", "f": ["Заполнить в первую очередь: семь позиций меню готовятся без документа."], "g": ["заполнить"], "id": 81}, {"s": "Соусы", "n": "Гуакамоле — покупное", "p": "покупной п/ф", "o": "по упаковке", "k": "—", "c": [["Гуакамоле готовое, от поставщика", "по спецификации"]], "t": "<p><b>Собственная рецептура отменена — продукт закупается готовым.<\/b> В меню называется «мятый авокадо».<\/p><p>Идёт примерно в десять позиций: все шесть завтраков НИНИ, брускетта креветка, боул тунец греча, грин-боул.<\/p><p><b>Что нужно от поставщика:<\/b> спецификация с составом, аллергенами и сроком после вскрытия.<\/p><p><b>Контроль.<\/b> Темнеет быстрее любого другого п/ф на кухне: держим закрытым, набираем чистой ложкой, потемневшее — в отход. Серое гуакамоле гостю не отдаём.<\/p>", "a": "Уточнять по спецификации поставщика.", "f": ["Срок после вскрытия — по спецификации поставщика, запросить."], "g": [], "id": 82}, {"s": "Соусы", "n": "Песто — покупной", "p": "покупной п/ф", "o": "по упаковке", "k": "—", "c": [["Песто готовое, от поставщика", "по спецификации"]], "t": "<p><b>Собственная рецептура отменена — соус закупается готовым.<\/b><\/p><p>Идёт в сэндвич с индейкой, брускетту с курицей и белковый омлет.<\/p><p><b>Что нужно от поставщика:<\/b> спецификация с составом, аллергенами и сроком годности после вскрытия. Именно этот срок ставим в карту, а не общий норматив.<\/p><p><b>Контроль.<\/b> Песто темнеет на воздухе — банку держим закрытой, наносим при сборке.<\/p>", "a": "Уточнять по спецификации поставщика: обычно орехи, молоко (пармезан), возможен кунжут.", "f": ["Граммовка песто в сэндвиче с индейкой не проставлена.", "Срок после вскрытия — по спецификации поставщика, запросить."], "g": [], "id": 83}, {"s": "Крупы", "n": "Рис", "p": "заготовка", "o": "из 900 г крупы", "k": "—", "c": [["Рис", "900 г"], ["Вода", "1800 г — пропорция 1:2"], ["Масло растительное", "15 г / 1 ложка"]], "t": "<p>Промыть рис до прозрачной воды, 4–5 раз. Налить воду, добавить масло.<\/p><p>Мультиварка, режим «крупа», 20 минут.<\/p><p><strong>После приготовления крышку не открывать 5–10 минут<\/strong> — рис должен настояться.<\/p>", "a": "—", "f": ["Срок хранения: рис для поке 2 дня, рис для каши 5 дней."], "g": [], "id": 84}, {"s": "Крупы", "n": "Заправка для риса поке", "p": "заготовка", "o": "≈115 мл", "k": "—", "c": [["Вода", "100 мл"], ["Сахар", "2 ч. л."], ["Соль", "1 ч. л."], ["Рисовый уксус", "3 ч. л."]], "t": "Нагреть воду в сотейнике, растворить сахар и соль, добавить рисовый уксус. Вылить заправку в готовый рис и тщательно перемешать.", "a": "—", "f": ["Содержит сахар и идёт в рис всех пятнадцати поке и боулов. На прямой вопрос гостя «в боуле есть сахар» честный ответ — да."], "g": [], "id": 85}, {"s": "Крупы", "n": "Гречка", "p": "заготовка", "o": "из 300 г крупы", "k": "—", "c": [["Гречка", "300 г"], ["Вода", "600 мл — пропорция 1:2"], ["Соль", "½ ч. л."], ["Масло сливочное", "для обжарки"]], "t": "<p>Гречку поджарить на сковороде со сливочным маслом. Пересыпать в сотейник, залить холодной водой, посолить.<\/p><p>Довести до кипения, убавить огонь до минимума, под крышкой 15–20 минут до выкипания воды.<\/p><p><strong>Не мешать и не открывать крышку.<\/strong> После — дать настояться 5–10 минут.<\/p>", "a": "—", "f": ["Срок хранения: 3 дня."], "g": [], "id": 86}, {"s": "Крупы", "n": "Киноа", "p": "заготовка", "o": "из 300 г крупы", "k": "—", "c": [["Смесь киноа", "300 г"], ["Вода", "600 г"]], "t": "<p>Промыть в мелком сите до прозрачной воды. Залить холодной водой, посолить, довести до кипения.<\/p><p>Убавить до минимума и варить 15–20 минут <strong>без крышки<\/strong> до выкипания воды.<\/p><p>Снять с огня, накрыть крышкой, дать настояться 5–10 минут.<\/p>", "a": "—", "f": ["Срок хранения: 7 дней."], "g": [], "id": 87}, {"s": "Крупы", "n": "Пшено", "p": "заготовка", "o": "из 300 г крупы", "k": "—", "c": [["Пшено", "300 г"], ["Вода", "700 г"]], "t": "<p>Тщательно промыть в тёплой воде до прозрачности, залить кипятком, замочить 10 минут, слить.<\/p><p>Отдельно вскипятить воду с солью и сахаром. Всыпать подготовленное пшено, перемешать. Убавить огонь до минимума, накрыть крышкой, варить без помешивания.<\/p><p>Снять с огня, дать настояться под крышкой 10 минут.<\/p>", "a": "—", "f": ["Время варки в карте не указано. У гречки 15–20 минут, у булгура 10 — у пшена пропущено.", "Срок хранения: 5 дней."], "g": [], "id": 88}, {"s": "Крупы", "n": "Булгур", "p": "заготовка", "o": "из 300 г крупы", "k": "—", "c": [["Булгур", "300 г"], ["Вода", "600 г"]], "t": "<p><strong>Не мыть.<\/strong> Обжарить в сухом виде в сливочном масле.<\/p><p>Вскипятить воду с солью, всыпать булгур, перемешать один раз. Убавить огонь до минимума, накрыть крышкой, варить без помешивания 10 минут.<\/p><p>Снять, настоять под крышкой 5–10 минут.<\/p>", "a": "Глютен.", "f": ["Срок хранения: 3 дня."], "g": [], "id": 89}, {"s": "П/Ф мясо/рыба", "n": "Курица су-вид", "p": "заготовка", "o": "500 г", "k": "—", "c": [["Куриное филе", "500 г"], ["Специя для курицы", "1 ст. л."], ["Масло растительное", "2 ст. л."]], "t": "<p>Курицу замариновать, завакуумировать.<\/p><p><strong>Термостат 65 °C, 2 часа.<\/strong><\/p><p>После таймера вытащить и охладить льдом. Перед нарезкой убрать лишнюю влагу полотенцем.<\/p>", "a": "—", "f": ["С проработки 15.08: следить за режимом. Готовить порционно, порцию уменьшить.", "Хранение: в вакууме 7 дней, после вскрытия 3 дня."], "g": [], "id": 90}, {"s": "П/Ф мясо/рыба", "n": "Индейка су-вид", "p": "заготовка", "o": "800 г", "k": "—", "c": [["Индейка", "800 г"], ["Специя для индейки", "2 ст. л."], ["Чесночное масло", "4 ч. л."], ["Вода", "4 ст. л."]], "t": "<p>Замариновать, завакуумировать. <strong>Термостат 65 °C, 2 часа.<\/strong><\/p><p>Охладить льдом. Перед нарезкой убрать лишнюю влагу полотенцем.<\/p>", "a": "—", "f": ["С проработки 15.08: следить за режимом. Готовить порционно, порцию уменьшить.", "Хранение: в вакууме 7 дней, после вскрытия 3 дня. Ветчина из индейки — 15 и 3 дня."], "g": [], "id": 91}, {"s": "П/Ф мясо/рыба", "n": "Ростбиф", "p": "заготовка", "o": "700 г", "k": "—", "c": [["Говяжья вырезка", "700 г"], ["Тимьян, соль морская, перец", "по вкусу"], ["Масло сливочное", "30 г"], ["— для обжарки: масло раст.", "50 г"], ["— чеснок", "5 г"], ["— французские травы", "по вкусу"]], "t": "<p>Су-вид <strong>62 °C, 2 часа<\/strong>. После таймера охладить льдом.<\/p><p><strong>Обжарка:<\/strong> обжарить чеснок с французскими травами на раскалённой сковороде, чеснок убрать. Обжарить ростбиф со всех сторон до золотистой корочки — примерно полминуты с каждой стороны.<\/p>", "a": "Молоко.", "f": ["Хранение: в вакууме 15 дней, после вскрытия 3 дня."], "g": [], "id": 92}, {"s": "Полуфабрикаты", "n": "Драники", "p": "заготовка", "o": "из 1 кг овощей", "k": "—", "c": [["Картофель", "800 г"], ["Батат", "200 г"], ["Яйцо", "3 шт"], ["Мука", "200 г"], ["Соль, перец чёрный", "по вкусу"]], "t": "<p>Картофель и батат натереть на мелкой тёрке, перемешать все ингредиенты.<\/p><p>Обжаривать на сковороде с четырьмя делениями на медленном огне до золотистой корочки.<\/p><p>После остывания расфасовать по 3 штуки и хранить в морозильнике.<\/p><p><strong>При подаче запекать в саламандре 8 минут.<\/strong><\/p>", "a": "Яйца, глютен.", "f": ["В меню блюдо названо «запечённые драники», по факту основная термообработка — жарка.", "Срок хранения в морозильнике не установлен."], "g": [], "id": 93}, {"s": "Соусы", "n": "Соус для шакшуки", "p": "заготовка", "o": "8 порций · ≈1200 г", "k": "—", "c": [["Масло оливковое", "50 г"], ["Лук репчатый", "260 г"], ["Чеснок", "12 г"], ["Перец сладкий красный", "600 г"], ["Помидоры свежие", "550 г"], ["Томатная паста", "100 г"], ["Кумин (зира)", "6 г"], ["Паприка копчёная", "6 г"], ["Чили перец", "2,5 г"], ["Кориандр молотый", "2,5 г"], ["Перец чёрный", "2,5 г"], ["Вода", "50–80 мл"], ["Соль / сахар", "по вкусу"]], "t": "<p>1. Запечь очищенные половинки перца при 220 °C 40 минут, снять кожуру.<br>2. С помидоров снять кожуру бланшированием.<br>3. Всё нарезать кубиком.<br>4. Разогреть масло, обжарить лук до мягкости 5–7 минут.<br>5. Добавить чеснок, ещё 1 минуту.<br>6. Добавить все специи, <strong>кроме зиры<\/strong>.<br>7. Положить перцы и томаты, готовить 5–7 минут.<br>8. Добавить томатную пасту.<br>9. Убавить огонь, томить 15–20 минут до загустения, добавить воды.<br>10. Довести до вкуса солью, перцем, сахаром.<br>11. Пробить погружным блендером в отдельной таре.<br>12. Вернуть на сковороду, добавить зиру и довести до готовности.<\/p>", "a": "—", "f": ["Сахар «по вкусу» не нормирован.", "Срок хранения: 5 дней."], "g": [], "id": 94}, {"s": "Полуфабрикаты", "n": "Вяленые томаты", "p": "заготовка", "o": "из 300 г черри", "k": "—", "c": [["Черри", "300 г"], ["Тимьян", "6 г"], ["Чесночное масло", "30 г"], ["Масло растительное", "для заливки"]], "t": "<p>Черри разрезать на четверти, добавить чесночное масло и тимьян, перемешать.<\/p><p>Выложить на коврик <strong>разрезом вверх<\/strong>. Духовка 100 °C, 2,5 часа.<\/p><p>Переложить в контейнер и залить маслом доверху.<\/p>", "a": "—", "f": ["Срок хранения: 14 дней."], "g": [], "id": 95}, {"s": "Полуфабрикаты", "n": "Маринованная морковь", "p": "заготовка", "o": "из 700 г моркови", "k": "—", "c": [["Морковь", "700 г"], ["Имбирь маринованный без влаги", "30 г"], ["Чеснок", "3–4 зубчика"], ["Масло кунжутное", "80 г"], ["Сахар", "2 ч. л."], ["Соевый соус", "2 ст. л."], ["Рисовый уксус", "2 ст. л."], ["Сок лимона", "1 ст. л."], ["Кунжут", "по вкусу"]], "t": "<p>Морковь почистить и натереть на тёрке для шинковки соломкой.<\/p><p>Имбирь отжать и мелко нарезать с чесноком, обжарить на кунжутном масле до золотистого цвета.<\/p><p>Снять с огня, добавить соевый соус, лимонный сок и рисовый уксус. Вылить маринад на морковь, засыпать кунжут, тщательно перемешать.<\/p>", "a": "Кунжут, соя, глютен.", "f": ["Срок хранения: 3 недели."], "g": [], "id": 96}, {"s": "П/Ф мясо/рыба", "n": "Намазка из тунца", "p": "заготовка", "o": "≈230 г", "k": "—", "c": [["Яйцо", "2 шт"], ["Тунец консервированный", "1 банка / 130 г"], ["Творожный мусс", "15 г"], ["Огурец мелким кубиком", "30 г"], ["Укроп", "по вкусу"], ["Сок лимона", "пара капель"], ["Соль, перец", "по вкусу"]], "t": "<p>Отварить яйца 7 минут. Слить лишнюю жидкость с тунца, переложить в ёмкость.<\/p><p>Готовые яйца и тунец раздавить вилкой, добавить остальные ингредиенты и перемешать.<\/p>", "a": "Яйца, рыба, молоко.", "f": ["В карте заготовки 2 яйца, в карте сэндвича с тунцом — 1 яйцо. Свести.", "Срок хранения не установлен."], "g": [], "id": 97}, {"s": "Яйца", "n": "Шпинатный омлет", "p": "заготовка", "o": "на 1 порцию", "k": "—", "c": [["Яйца", "3 шт"], ["Шпинат", "10 г"]], "t": "<p>Яйца 3 шт со шпинатом 10 г пробить погружным блендером до ровного зелёного цвета.<\/p><p><b>Вылить на холодную сковороду<\/b> и обжарить как обычный омлет на слабом огне. На горячей сковороде шпинатная масса схватывается пятнами и цвет получается неровным.<\/p><p>Заготовка для завтрака НИНИ «ЗОЖ».<\/p>", "a": "Яйца.", "f": [], "g": [], "id": 98}, {"s": "Полуфабрикаты", "n": "Вафли льняная и картофельная", "p": "заготовка", "o": "6 шт", "k": "—", "c": [["Яйца", "3 шт"], ["Смесь", "2 упаковки / 300 г"], ["Мука", "200 г"], ["Вода", "200 г"], ["Молоко", "200 г"], ["Соль", "по вкусу"]], "t": "Все ингредиенты взбить венчиком. Выпекать в вафельнице при <strong>200 °C<\/strong>.", "a": "Яйца, молоко, глютен.", "f": ["Тесто в этой карте и в картах блюд разное: здесь 3 яйца, смесь 300 г, мука 200 г, вода 200 г, молоко 200 г; в картах вафель — 2 яйца, мука 100, вода 100–150, молоко 100, смесь 150 на 6 шт.", "Срок хранения не установлен."], "g": [], "id": 99}, {"s": "Полуфабрикаты", "n": "Вафля шпинатная зелёная", "p": "заготовка", "o": "6 шт", "k": "—", "c": [["Яйца", "3 шт"], ["Шпинат", "60 г"], ["Смесь", "2 упаковки / 300 г"], ["Мука", "200 г"], ["Вода", "200 г"], ["Молоко", "200 г"], ["Соль", "по вкусу"]], "t": "<p>Взбить блендером яйца со шпинатом. Все ингредиенты смешать венчиком.<\/p><p>Выпекать в вафельнице при <strong>200 °C<\/strong>. Заготавливаем заранее и храним в морозильной камере.<\/p>", "a": "Яйца, молоко, глютен.", "f": [], "g": [], "id": 100}, {"s": "Яйца", "n": "Яйца · санобработка и варка", "p": "регламент", "o": "—", "k": "—", "c": [["Куриное яйцо", "7 минут в кипятке"], ["Перепелиное яйцо", "4 минуты в кипятке"]], "t": "<p><strong>Санобработка.<\/strong> Выложить яйца на дно раковины, залить водой, положить 1 таблетку хлора, держать 10 минут. Слить, сполоснуть, переложить в контейнер.<\/p><p><strong>Куриное:<\/strong> опустить в кипящую воду на 7 минут, остудить в холодной воде.<\/p><p><strong>Перепелиное:<\/strong> 4 минуты в кипятке, остудить в воде со льдом 5 минут. Перед чисткой прокатить яйцо по столу ладонью, чтобы скорлупа покрылась мелкими трещинами.<\/p>", "a": "Яйца.", "f": ["Тесто в этой карте и в карте блюда разное: здесь 3 яйца, шпинат 60, смесь 300, мука 200, вода 200, молоко 200; в карте шпинатной вафли с лососем — шпинат 60, мука рисовая 60, яйцо 1, кокосовое молоко 50, разрыхлитель 3, масло 20 на 2 вафли.", "Срок хранения не установлен."], "g": [], "id": 101}, {"id": 102, "s": "ПП to go", "n": "Сэндвич с курицей", "p": "", "o": "251 г", "k": "448 / 23,8 / 15,9 / 48,5", "kl": "КБЖУ на порцию", "c": [["Хлеб пшеничный", "90 г"], ["Курица су-вид", "50 г"], ["Микс салата", "10 г"], ["Огурцы", "20 г"], ["Помидоры", "20 г"], ["Соус: майонез лёгкий", "50 г"], ["Соус: горчица дижонская", "10 г"], ["Соус: сок лимона", "1 г"]], "t": "<p>Соус: майонез лёгкий 50 г, горчицу дижонскую 10 г и 2–3 капли лимонного сока смешать до однородности.<\/p><p>Хлеб 90 г разрезать вдоль и подсушить срезом на сухом гриле 20–30 секунд, остудить.<\/p><p>Курицу су-вид нарезать слайсами 3–4 мм, огурцы и помидоры — кружками 3 мм.<\/p><p>Сборка: нижнюю половину смазать половиной соуса, выложить микс салата, помидоры, огурцы, курицу, полить оставшимся соусом, накрыть верхней половиной.<\/p><p>Разрезать пополам по диагонали, плотно уложить в малый квадратный бокс срезом вверх. Закрыть крышкой, наклеить наклейку ПП to go с датой и временем изготовления.<\/p>", "a": "", "f": ["Хлеб пшеничный 90 г: цены нет, себестоимость без хлеба.", "КБЖУ ориентировочное, по справочным данным; уточнить по этикеткам сырья.", "Технология написана Claude 04.10.2026 — проверить шеф-повару."], "g": []}, {"id": 103, "s": "ПП to go", "n": "Сэндвич с индейкой и скрэмблом", "p": "", "o": "330 г", "k": "618 / 35,2 / 29,3 / 48,5", "kl": "КБЖУ на порцию", "c": [["Хлеб пшеничный", "90 г"], ["Индейка су-вид", "50 г"], ["Скрэмбл: яйцо", "100 г"], ["Скрэмбл: сливки 33 %", "10 г"], ["Майонез лёгкий", "40 г"], ["Песто", "10 г"], ["Микс салата", "10 г"], ["Помидоры", "20 г"]], "t": "<p>Скрэмбл: яйца 2 шт взбить со сливками 10 г и щепоткой соли, готовить на слабом огне, постоянно помешивая, до мягких крупных хлопьев. Остудить до комнатной температуры.<\/p><p>Соус: майонез лёгкий 40 г смешать с песто 10 г.<\/p><p>Хлеб 90 г разрезать вдоль и подсушить срезом на сухом гриле 20–30 секунд, остудить.<\/p><p>Индейку су-вид нарезать слайсами 3–4 мм, помидоры — кружками 3 мм.<\/p><p>Сборка: нижнюю половину смазать половиной соуса, выложить микс салата, помидоры, индейку, скрэмбл, полить оставшимся соусом, накрыть верхней половиной.<\/p><p>Разрезать пополам, плотно уложить в малый квадратный бокс срезом вверх. Закрыть крышкой, наклеить наклейку ПП to go с датой и временем изготовления.<\/p>", "a": "", "f": ["Состав не отмечен как утверждённый (нет ✅).", "Хлеб пшеничный 90 г: цены нет, себестоимость без хлеба.", "КБЖУ ориентировочное, по справочным данным; уточнить по этикеткам сырья.", "Технология написана Claude 04.10.2026 — проверить шеф-повару."], "g": ["проект"]}, {"id": 104, "s": "ПП to go", "n": "Сэндвич с намазкой из тунца", "p": "", "o": "285 г", "k": "441 / 21,2 / 16,3 / 49,7", "kl": "КБЖУ на порцию", "c": [["Хлеб пшеничный", "90 г"], ["Намазка из тунца", "70 г"], ["Помидоры", "50 г"], ["Микс салата", "15 г"], ["Лук маринованный", "10 г"], ["Соус: сыр творожный + горчица (40 + 10)", "50 г"]], "t": "<p>Соус: сыр творожный 40 г и горчицу 10 г смешать до однородности.<\/p><p>Хлеб 90 г разрезать вдоль и подсушить срезом на сухом гриле 20–30 секунд, остудить.<\/p><p>Помидоры нарезать кружками 3 мм, лук маринованный обсушить от маринада.<\/p><p>Сборка: обе половины смазать соусом; на нижнюю выложить микс салата, помидоры, намазку из тунца 70 г, лук маринованный, накрыть верхней половиной.<\/p><p>Разрезать пополам, плотно уложить в малый квадратный бокс срезом вверх. Закрыть крышкой, наклеить наклейку ПП to go с датой и временем изготовления.<\/p>", "a": "", "f": ["Состав не отмечен как утверждённый (нет ✅).", "Хлеб пшеничный 90 г: цены нет, себестоимость без хлеба.", "КБЖУ ориентировочное, по справочным данным; уточнить по этикеткам сырья.", "Технология написана Claude 04.10.2026 — проверить шеф-повару."], "g": ["проект"]}, {"id": 105, "s": "ПП to go", "n": "Набор: булгур · яйцо · индейка · зелень", "p": "", "o": "380 г", "k": "367 / 29 / 12,5 / 37", "kl": "КБЖУ на порцию", "c": [["Булгур варёный", "150 г"], ["Яйцо", "50 г"], ["Индейка су-вид", "50 г"], ["Брокколи", "50 г"], ["Фасоль стручковая", "50 г"], ["Соус чесночный", "30 г"]], "t": "<p>Булгур приготовить по технологической карте «Булгур».<\/p><p>Брокколи разобрать на соцветия, фасоль стручковую обрезать; бланшировать в кипящей подсоленной воде 3–4 минуты и сразу остудить в ледяной воде, обсушить.<\/p><p>Яйцо отварить 9–10 минут после закипания, остудить в холодной воде, очистить, разрезать пополам.<\/p><p>Индейку су-вид нарезать слайсами 3–4 мм.<\/p><p>Сборка в средний квадратный бокс: булгур 150 г выложить на одну половину бокса; на вторую — брокколи 50 г, фасоль стручковую 50 г и индейку; сверху — яйцо половинками.<\/p><p>Соус чесночный 30 г налить в соусник с крышкой и поставить в бокс. Закрыть крышкой, наклеить наклейку ПП to go с датой и временем изготовления.<\/p>", "a": "", "f": ["Вес набора 380 г при лимите «300 г макс».", "КБЖУ ориентировочное, по справочным данным; уточнить по этикеткам сырья.", "Технология написана Claude 04.10.2026 — проверить шеф-повару."], "g": []}, {"id": 106, "s": "ПП to go", "n": "Набор: гречка · яйцо · курица · зелень", "p": "", "o": "380 г", "k": "417 / 31,4 / 15 / 41,7", "kl": "КБЖУ на порцию", "c": [["Гречка варёная", "150 г"], ["Яйцо", "50 г"], ["Курица су-вид", "50 г"], ["Брокколи", "50 г"], ["Фасоль стручковая", "50 г"], ["Соус ореховый", "30 г"]], "t": "<p>Гречку приготовить по технологической карте «Гречка».<\/p><p>Брокколи разобрать на соцветия, фасоль стручковую обрезать; бланшировать в кипящей подсоленной воде 3–4 минуты и сразу о // ---- quantity scaling ----
// Scales only numbers that carry a unit ("20 / 30 г", "2 шт", "1 ч. л."); leaves "по 90 г", ratios "1:2", "на 10 порций", minutes untouched.
const NUM="(?:\\d+(?:[.,]\\d+)?|½|¼|¾)";
const UNIT="(?:г|кг|мл|л|шт|ч\\.\\s?л\\.|ст\\.\\s?л\\.|зубч[а-яё]*|банк[а-яё]*|упаков[а-яё]*|таблет[а-яё]*|шот[а-яё]*|ложк[а-яё]*)(?![а-яё])";
const CHAIN=new RegExp("("+NUM+"(?:\\s*[–-]\\s*"+NUM+")?(?:\\s*\\/\\s*"+NUM+"(?:\\s*[–-]\\s*"+NUM+")?)*)(\\s*)("+UNIT+")","gi");
const FR={"½":.5,"¼":.25,"¾":.75};
const toN=s=>FR[s]!=null?FR[s]:parseFloat(s.replace(",","."));
function fmt(n){
  if(Math.abs(n-Math.round(n))<1e-9) return String(Math.round(n));
  const r=n<10?Math.round(n*10)/10:Math.round(n);
  return String(r).replace(".",",");
}
function scale(str,k){
  if(k===1) return {s:str,changed:false};
  let changed=false;
  const s=str.replace(CHAIN,(m,nums,sp,unit,off,full)=>{
    const before=full.slice(Math.max(0,off-3),off).toLowerCase();
    if(/по\s$|на\s$/.test(before)) return m;
    changed=true;
    return nums.replace(new RegExp(NUM,"g"),x=>fmt(toN(x)*k))+sp+unit;
  });
  return {s,changed};
}

const norm=s=>s.toLowerCase().replace(/[«»"()]/g,"").replace(/\s+/g," ").trim();
function storeFor(d){
  const n=norm(d.n);
  return ST.find(x=>{const m=norm(x.n.split(" · ")[0].split(" — ")[0]);return m.length>3&&(n===m||n.startsWith(m)||m.startsWith(n));});
}

  let last="";
  for(const x of rows){
    if(x.c!==last){h+='<div class="sechead">'+esc(x.c)+'</div>';last=x.c;}
    const term=x.t?esc(x.t):x.src===3?"по спецификации поставщика":"срок не установлен";
    h+='<div class="st"><div class="n">'+esc(x.n)+'</div><div class="t'+(x.src===0?" gap":"")+'">'+term+'</div>'+
      '<div class="w">'+esc(x.w)+(x.T&&x.T!=="—"?' · '+esc(x.T):'')+'</div>'+(x.r?'<div class="r">'+esc(x.r)+'</div>':'')+'</div>';
  }
  if(!rows.length) h+='<p class="empty">Ничего не нашлось.</p>';
  $("list").innerHTML=h;
}

// sticky offsets depend on header height (chips/allergen panel)
function measure(){document.documentElement.style.setProperty("--toph",$("top").offsetHeight+"px");}
window.addEventListener("resize",measure);

if(!ST.length) $("bStore").hidden=true;
drawAlgs();syncButtons();renderList();renderCard();measure();route();
</script>
</body>
